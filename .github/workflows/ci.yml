name: Build validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out RhythmicSpace
        uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libjack-jackd2-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            mesa-common-dev

      - name: Fetch JUCE 8.0.10
        run: git clone --branch 8.0.10 --depth 1 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Build Projucer
        run: make -C "$RUNNER_TEMP/JUCE/extras/Projucer/Builds/LinuxMakefile" CONFIG=Release -j2

      - name: Generate Linux project
        run: |
          projucer="$RUNNER_TEMP/JUCE/extras/Projucer/Builds/LinuxMakefile/build/Projucer"
          "$projucer" --set-global-search-path linux defaultJuceModulePath "$RUNNER_TEMP/JUCE/modules"
          "$projucer" --resave RhythmicSpace.jucer

      - name: Build Standalone
        run: make -C Builds/LinuxMakefile CONFIG=Release Standalone -j2

      - name: Build VST3
        run: make -C Builds/LinuxMakefile CONFIG=Release VST3 -j2
